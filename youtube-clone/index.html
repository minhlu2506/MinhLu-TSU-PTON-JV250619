<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Clone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-left">
        <button id="menuToggle" class="icon-button" aria-label="Toggle sidebar">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <a class="brand" href="#" aria-label="YouTube Home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 97 20" class="yt-logo" aria-hidden="true" focusable="false">
            <g fill="currentColor">
              <path d="M19.6 3.2c.6 2.1.6 6.5.6 6.5s0 4.4-.6 6.5c-.3 1.3-1.3 2.3-2.6 2.6C14.9 19.4 9.5 19.4 9.5 19.4s-5.4 0-7.5-.6C.7 18.5-.3 17.5 0 16.2.6 14.1.6 9.7.6 9.7S.6 5.3 0 3.2C-.3 1.9.7.9 2 .6 4.1 0 9.5 0 9.5 0s5.4 0 7.5.6c1.3.3 2.3 1.3 2.6 2.6z"></path>
              <path fill="#fff" d="M7.7 14.2V5.2l7.2 4.5-7.2 4.5z"></path>
            </g>
          </svg>
          <span class="brand-text">YouTube</span>
        </a>
      </div>

      <div class="header-center">
        <form id="searchForm" class="search-form" role="search" aria-label="Search">
          <div class="search-input-wrap">
            <input id="searchInput" class="search-input" type="text" placeholder="Search" aria-label="Search" />
          </div>
          <button class="search-button" type="submit" aria-label="Search">
            <span class="material-symbols-outlined">search</span>
          </button>
        </form>
        <button class="icon-button mic-button" aria-label="Search with your voice">
          <span class="material-symbols-outlined">mic</span>
        </button>
      </div>

      <div class="header-right">
        <button class="icon-button" aria-label="Create">
          <span class="material-symbols-outlined">video_call</span>
        </button>
        <button class="icon-button" aria-label="Notifications">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <button class="avatar-button" aria-label="Account">
          <img src="https://i.pravatar.cc/40?img=12" alt="User avatar" />
        </button>
      </div>
    </header>

    <div class="app-shell">
      <aside id="sidebar" class="sidebar">
        <nav class="nav">
          <a class="nav-item active" href="#">
            <span class="material-symbols-outlined">home</span>
            <span class="label">Home</span>
          </a>
          <a class="nav-item" href="#">
            <span class="material-symbols-outlined">bolt</span>
            <span class="label">Shorts</span>
          </a>
          <a class="nav-item" href="#">
            <span class="material-symbols-outlined">subscriptions</span>
            <span class="label">Subscriptions</span>
          </a>
          <hr />
          <a class="nav-item" href="#">
            <span class="material-symbols-outlined">video_library</span>
            <span class="label">You</span>
          </a>
          <a class="nav-item" href="#">
            <span class="material-symbols-outlined">history</span>
            <span class="label">History</span>
          </a>
        </nav>
      </aside>

      <main class="content">
        <div class="chips" id="chips">
          <button class="chip active">All</button>
          <button class="chip">Music</button>
          <button class="chip">Gaming</button>
          <button class="chip">Live</button>
          <button class="chip">JavaScript</button>
          <button class="chip">Podcasts</button>
          <button class="chip">News</button>
          <button class="chip">Computers</button>
          <button class="chip">Mixes</button>
          <button class="chip">Recently uploaded</button>
          <button class="chip">Watched</button>
          <button class="chip">New to you</button>
        </div>

        <section id="videoGrid" class="video-grid" aria-label="Videos"></section>
      </main>
    </div>

    <script src="./script.js" defer></script>
  </body>
</html>
